<style>
/* Layout: una columna de trabajo. Arriba el estado del stock, luego cuatro pasos en orden, un panel por paso. */
:root{
  /* Paleta Marea: azul #284b85, celeste #a0b8c4, terracota #af7e5d, salvia #c5cca0, arena #ded6bf, fondo #f6f5f0 */
  --bg:#f6f5f0; --surface:#ffffff; --sunk:#ece7d8; --ink:#1b2d4f; --muted:#5c6679; --line:#ded6bf;
  --accent:#284b85; --accent-ink:#ffffff; --tint:#dde7ec;
  --ok:#4d5a1f; --ok-bg:#e2e6c8; --warn:#85492b; --warn-bg:#f2e0d3; --bad:#a82a22; --bad-bg:#f9dedb; --low:#6a5300; --low-bg:#f7e9a6;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111a2c; --surface:#1a2540; --sunk:#151e34; --ink:#eeece2; --muted:#9daabf; --line:#2e3c5e;
  --accent:#a0b8c4; --accent-ink:#13203a; --tint:#24345a;
  --ok:#c5cca0; --ok-bg:#2e3a22; --warn:#dba888; --warn-bg:#40291c; --bad:#ff9a90; --bad-bg:#40191a; --low:#f1d778; --low-bg:#473b0e;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111a2c; --surface:#1a2540; --sunk:#151e34; --ink:#eeece2; --muted:#9daabf; --line:#2e3c5e;
  --accent:#a0b8c4; --accent-ink:#13203a; --tint:#24345a;
  --ok:#c5cca0; --ok-bg:#2e3a22; --warn:#dba888; --warn-bg:#40291c; --bad:#ff9a90; --bad-bg:#40191a; --low:#f1d778; --low-bg:#473b0e;
  color-scheme:dark }

.brand{display:flex;align-items:center;gap:14px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* stock */
.stock{display:flex;flex-direction:column;gap:10px}
.stock-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.locs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.loc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.loc b{font-size:15px;overflow-wrap:anywhere}
.loc .big{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.arrow{align-self:center;color:var(--muted);font-size:20px}
@media (max-width:620px){ .locs{grid-template-columns:1fr} .arrow{transform:rotate(90deg);justify-self:center} }

/* pasos */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps button{width:100%;text-align:left;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:8px 10px;color:var(--muted);font:inherit;font-size:13.5px;display:flex;gap:8px;align-items:center;min-width:0}
.steps button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-size:12px;font-weight:650}
.steps .done{color:var(--ink);cursor:pointer}
.steps .done .n{background:var(--ok-bg);color:var(--ok)}
.steps .now{background:var(--surface);border-color:var(--accent);color:var(--ink);font-weight:600}
.steps .now .n{background:var(--accent);color:var(--accent-ink)}

function readStock(text, file){
  const rows = parseCSV(text); if (!rows.length) throw new Error('El archivo está vacío.');
  const raw = rows[0], H = raw.map(norm);
  const iRef = col(H,'ref','sku'), iName = col(H,'nombre','name'), iHandle = col(H,'handle');
  const inv = []; raw.forEach((h,i) => { const m = /^\s*(?:en inventario|in stock)\s*\[(.+)\]\s*$/i.exec(h); if (m) inv.push([i, m[1].trim()]); });
  const opts = H.map((h,i) => /^(opcion|option) \d (valor|value)$/.test(h) ? i : -1).filter(i => i >= 0);
  if (iRef < 0 || !inv.length) throw new Error('Este archivo no trae las columnas REF y "En inventario [...]". Descárgalo en Loyverse desde Artículos → Exportar.');
  const iCat = col(H,'categoria','category'), iPrice = col(H,'precio por defecto','default price'), iCost = col(H,'coste','cost'), iTrack = col(H,'seguir el inventario','track stock');
  let lastH = null, lastN = '', lastC = '', lastT = '', n = 0;
  for (const r of rows.slice(1)){
    const ref = (r[iRef] || '').trim(); if (!ref) continue;
    const handle = iHandle >= 0 ? r[iHandle] : ref;
    let name = iName >= 0 ? (r[iName] || '').trim().normalize('NFC') : '';
    if (name){ lastH = handle; lastN = name; lastC = iCat >= 0 ? (r[iCat] || '').trim() : ''; lastT = iTrack >= 0 ? (r[iTrack] || '').trim() : ''; } else if (handle === lastH) name = lastN;
    const it = S.stock[ref] || (S.stock[ref] = {n:'', v:'', q:{}});
    if (name) it.n = name;
    if (handle === lastH){ if (iCat >= 0) it.c = lastC; if (iTrack >= 0){ if (/^n/i.test(lastT)) it.t = false; else delete it.t; } }
    if (iPrice >= 0) it.p = /^-?[\d.,]+$/.test((r[iPrice] || '').trim()) ? num(r[iPrice]) : null;
    if (iCost >= 0) it.k = /^-?[\d.,]+$/.test((r[iCost] || '').trim()) ? num(r[iCost]) : null;
    it.v = opts.map(i => (r[i] || '').trim()).filter(Boolean).join(' / ');
    for (const [i, loc] of inv) it.q[loc] = (r[i] || '').trim() === '' ? 0 : num(r[i]);

  }

}
function readSales(text, file){
  const rows = parseCSV(text); if (!rows.length) throw new Error('El archivo está vacío.');

  else if (t.dataset.note != null){
    const l = S.lines.find(x => x.ref === t.dataset.note); if (!l) return;
    l.note = t.value; t.classList.toggle('need', S.tried && !l.note.trim()); const row = t.closest('.item.none'); if (row) row.classList.toggle('need', S.tried && !resolved(l)); $('#pstat').innerHTML = packStatus(); save();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pk != null){ const pk = picks(); if (t.checked) pk[t.dataset.pk] = 1; else delete pk[t.dataset.pk]; S.lines = null; save(); $('#pList').innerHTML = pickList(); $('#pSum').textContent = pickSum(); const ch = document.querySelector('[data-pfil=picked]'); if (ch) ch.textContent = 'Elegidos (' + Object.keys(pk).length + ')'; return; }
  if (t.id === 'pDepot'){ pDepot = t.checked; $('#pList').innerHTML = pickList(); return; }
  if (t.dataset.tick != null){
    const l = S.lines.find(x => x.ref === t.dataset.tick); if (!l) return;
    l.ok = t.checked; save(); if (S.tried) $('#pack').innerHTML = packList(); else t.closest('.item').classList.toggle('on', l.ok); $('#pstat').innerHTML = packStatus();
  } else if (t.dataset.qty != null){ t.value = S.lines.find(x => x.ref === t.dataset.qty).qty; }
  else if (t.id === 'fileStock') pick(t, onStock);
  else if (t.id === 'fileSales') pick(t, onSales);
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const d = e.target.closest && e.target.closest('#drop'); if (!d) return;
  e.preventDefault(); d.classList.remove('over');
  const f = e.dataTransfer.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => { try { onSales(decode(rd.result), f.name); } catch(err){ say(err.message, 'bad'); } }; rd.readAsArrayBuffer(f);
});

S = load();
if (S.tid && !TR[S.tid]) storeT();
if (S.tid) mode = 'transfer';
if (Q.v === 'informe' && lvOn()) mode = 'report';
if (Q.v === 'stock'){ mode = 'stock'; sDepot = Q.d === 'orig' ? S.orig : S.dest; sFilter = ['one','zero','low'].includes(Q.f) ? Q.f : 'all'; }
render(); viewSync();
if (mode === 'report'){ cfgLoad(); if (Q.from && Q.to){ rep.range = 'otro'; rep.from = localDay(Q.from); rep.to = localDay(Q.to); repLoad([Q.from, Q.to, new Date(new Date(Q.from) - 7 * 864e5).toISOString(), new Date(new Date(Q.to) - 7 * 864e5).toISOString()]); } else repLoad(); }
if (!IN_CLAUDE && !LOCAL_ONLY){
  syncNow();
  setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 20000);
  addEventListener('online', () => syncNow());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
  if ('serviceWorker' in navigator && BAKED.indexOf('http') !== 0 && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
